appId: com.bolofy.agent
productName: Bolofy

directories:
  output: dist

files:
  - electron/**/*
  - client/dist/**/*
  - config.json
  - config.json.example
  - resources/**/*
  - package.json

# 🔥 VERY IMPORTANT
extraResources:
  - from: server
    to: server

# Only unpack server if needed (optional)
asarUnpack:
  - server/**/*

mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target:
    - dmg
    - zip

win:
  icon: resources/icon.png
  target:
    - nsis

linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb